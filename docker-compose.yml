# ==============================================================================
# Devmanus Local Backend & Chrome Extension Builder Docker Compose
# Fully automated multi-service setup:
# 1. Backend Server (Express on port 3000, serves API & extension dist preview)
# 2. Extension Builder (Auto-compiles Chrome extension and outputs to host ./dist/)
# ==============================================================================
version: "3.8"

services:
  # 1. Devmanus Express Preview Backend (port 3000)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: devmanus-backend:latest
    container_name: devmanus-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./dist:/app/dist:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      extension-builder:
        condition: service_completed_successfully
    restart: unless-stopped

  # 2. Chrome Extension Auto-Builder (compiles extension and writes to host ./dist folder)
  extension-builder:
    build:
      context: .
      dockerfile: Dockerfile.extension
    image: devmanus-extension-builder:latest
    container_name: devmanus-extension-builder
    volumes:
      - ./dist:/output
    restart: "no"
