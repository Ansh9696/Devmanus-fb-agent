# ==============================================================================
# Devmanus AI Local Backend, Ollama & Chrome Extension Builder Docker Compose
# Fully automated multi-service setup:
# 1. Backend Server (Express on port 3000, serves API & extension dist preview)
# 2. Ollama AI Engine (Local LLM service on port 11434)
# 3. Ollama Init (Auto-pulls base model & generates devmanus-agent from Modelfile)
# 4. Extension Builder (Auto-compiles Chrome extension and outputs to host ./dist/)
# ==============================================================================
version: "3.8"

services:
  # 1. Devmanus Express Planning Backend (port 3000)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: devmanus-backend:latest
    container_name: devmanus-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=devmanus-agent
    volumes:
      - ./dist:/app/dist:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
      extension-builder:
        condition: service_completed_successfully
    restart: unless-stopped

  # 2. Containerized Ollama Service (port 11434)
  ollama:
    image: ollama/ollama:latest
    container_name: devmanus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # 3. Model Auto-Generator (pulls llama3.2:1b and generates devmanus-agent from Modelfile)
  ollama-init:
    image: ollama/ollama:latest
    container_name: devmanus-ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    volumes:
      - ./ollama:/root/ollama:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3
        echo "Pulling base model llama3.2:1b..."
        ollama pull llama3.2:1b
        if [ -f /root/ollama/Modelfile ]; then
          echo "Generating devmanus-agent model from Modelfile..."
          ollama create devmanus-agent -f /root/ollama/Modelfile
          echo "✓ Devmanus agent model created from Modelfile successfully!"
        fi
        echo "Ollama model setup complete."
    restart: "no"

  # 4. Chrome Extension Auto-Builder (compiles extension and writes to host ./dist folder)
  extension-builder:
    build:
      context: .
      dockerfile: Dockerfile.extension
    image: devmanus-extension-builder:latest
    container_name: devmanus-extension-builder
    volumes:
      - ./dist:/output
    restart: "no"

volumes:
  ollama_models:
    name: devmanus_ollama_models
